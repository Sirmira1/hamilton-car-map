<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamilton Car Map</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-4">
        <h1 class="text-center mb-4">Hamilton Car Map</h1>
        <div class="d-flex justify-content-center mb-3 flex-wrap" id="filter-buttons">
            <button class="btn btn-primary m-1" data-category="all">All</button>
            <button class="btn btn-secondary m-1" data-category="car-wash">Car Wash</button>
            <button class="btn btn-success m-1" data-category="auto-shop">Auto Shop</button>
            <button class="btn btn-warning m-1" data-category="meet-spot">Meet Spot</button>
            <button class="btn btn-info m-1" data-category="scenic-route">Scenic Route</button>
        </div>
        <div id="map"></div>
        <br>
        <div class="text-center mb-3">
            <button id="routeBtn" class="btn btn-info">Get Directions</button>
        </div>
        <br>
        <div class="text-center mb-3">
            <button id="locate-btn" class="btn btn-dark">Show My Location</button>
        </div>
        <div class="card p-3 mb-4">
            <h5 class="mb-3">Add a Location</h5>
            <div class="row g-2">
                <div class="col-md-4">
                    <input id="place-name" class="form-control" placeholder="Location Name">
                </div>
                <div class="col-md-4">
                    <input id="place-address" class="form-control" placeholder="Address">
                </div>
                <div class="col-md-4">
                    <input id="place-desc" class="form-control" placeholder="Description">
                </div>
                <div class="col-md-3">
                    <select id="place-category" class="form-select">
                        <option value="car-wash">Car Wash</option>
                        <option value="auto-shop">Auto Shop</option>
                        <option value="meet-spot">Meet Spot</option>
                        <option value="scenic-route">Scenic Route</option>
                    </select>
                </div>
                <div class="col-md-1 d-grid">
                    <button id="add-marker-btn" class="btn btn-primary">Add</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAWmZR7qPVabHE9oNTykA9lA802XEC3GO4&libraries=places&callback=initMap" async defer></script>
</body>
</html>
